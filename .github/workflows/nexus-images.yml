# Builds the self-hosted worldmonitor images for Nexus at a pinned upstream commit
# and pushes them to this account's GitHub registry. Nothing is deployed from here.
name: nexus-images
on:
  push:
    branches: [nexus-build]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_SHA: 424d7f74568192d1daeb7808f51d882d2321d5aa
  TAG: 424d7f7
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nexus-worldmonitor-app
            context: .
            file: Dockerfile
          - name: nexus-worldmonitor-relay
            context: .
            file: Dockerfile.relay
          - name: nexus-worldmonitor-redis-rest
            context: docker
            file: docker/Dockerfile.redis-rest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UPSTREAM_SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.TAG }}
